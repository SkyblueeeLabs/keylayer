<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>KeyLayer</title>
<link rel="stylesheet" href="./tokens.css" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent; }
  body {
    font-size: var(--body-size); line-height: 1.5; padding: 10px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    color: var(--ink);
  }
  .panel {
    width: var(--panel-width); margin: 0; padding: var(--panel-padding);
    background: #fff; border: 1px solid var(--edge); border-radius: var(--panel-radius);
    box-shadow: 0 10px 30px rgba(0,0,0,.12);
  }
  .head { display: flex; align-items: flex-start; gap: 10px; }
  .head h1 { margin: 0; font-size: var(--title-size); font-weight: 500; }
  .head p { margin: 2px 0 0; font-size: var(--micro-size); color: var(--muted); }
  .spacer { flex: 1; }
  .switch { position: relative; width: 38px; height: 22px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .track {
    position: absolute; inset: 0; border-radius: 11px; background: var(--edge);
    cursor: pointer; transition: background .15s;
  }
  .track::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px;
    border-radius: 50%; background: #fff; transition: transform .15s;
    box-shadow: 0 1px 2px rgba(0,0,0,.2);
  }
  .switch input:checked + .track { background: var(--blue); }
  .switch input:checked + .track::after { transform: translateX(16px); }
  .status { display: flex; align-items: center; gap: 7px; margin-top: var(--gap); font-size: var(--caption-size); color: var(--muted); }
  .dot { width: var(--dot-size); height: var(--dot-size); border-radius: 50%; background: var(--green); flex: none; }
  .dot.off { background: var(--amber); }
  .hint { margin: 14px 0 10px; font-size: var(--caption-size); color: var(--muted); }
  .grid { display: flex; flex-direction: column; gap: var(--row-gap); }
  .row { display: flex; gap: var(--cap-gap); }
  .cap { width: var(--cap-width); text-align: center; }
  .cap .key {
    height: var(--cap-height); display: flex; align-items: center; justify-content: center;
    font-size: var(--body-size); font-weight: 500; border-radius: var(--cap-radius); border: 1px solid;
  }
  .cap .desc { margin-top: 3px; font-size: var(--micro-size); color: var(--muted); white-space: nowrap; overflow: hidden; }
  .g-direction .key { background: var(--blue-bg); border-color: var(--blue-border); color: var(--blue); }
  .g-action .key   { background: var(--amber-bg); border-color: var(--amber-border); color: var(--amber); }
  .g-scroll .key   { background: var(--green-bg); border-color: var(--green-border); color: var(--green); }
  .g-modifier .key { background: var(--purple-bg); border-color: var(--purple-border); color: var(--purple); }
  .note { margin-top: 10px; font-size: var(--micro-size); color: var(--muted); }
  hr { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }
  .foot { display: flex; align-items: center; gap: var(--row-gap); font-size: var(--caption-size); }
  button {
    font: inherit; font-size: var(--caption-size); padding: 4px 9px; border: 1px solid var(--edge);
    border-radius: 6px; background: #fff; color: var(--ink); cursor: pointer;
  }
  button:hover { background: #f5f4f0; }
  label.chk { display: flex; align-items: center; gap: 5px; color: var(--muted); }
  .badge { font-size: var(--micro-size); color: var(--amber); }
</style>
</head>
<body>
<div class="panel">
  <div class="head">
    <div>
      <h1>KeyLayer <span class="badge" id="preview" hidden>预览模式</span></h1>
      <p>Windows 改键习惯 · 托盘小工具</p>
    </div>
    <div class="spacer"></div>
    <label class="switch"><input type="checkbox" id="enabled" checked /><span class="track"></span></label>
  </div>

  <div class="status"><span class="dot" id="dot"></span><span id="statusText">生效中 · 键盘钩子已挂载</span></div>

  <p class="hint">按住 <b>Alt</b> 再按下列键（⇧ 保留选区）</p>
  <div class="grid" id="grid"></div>
  <p class="note">右 Alt → Shift · 右 Ctrl + B/G 打开网页 · VS Code 内 D 放行</p>

  <hr />
  <div class="foot">
    <label class="chk"><input type="checkbox" id="autostart" /> 开机自启</label>
    <div class="spacer"></div>
    <button id="quit">退出</button>
  </div>
</div>

<script src="./bindings.js"></script>
<script>
// 键帽数据来自生成的 bindings.js（唯一真相源：spec/keybindings.json）
function render() {
  const data = window.KeyLayerBindings;
  const grid = document.getElementById("grid");
  grid.innerHTML = data.rows.map(row =>
    `<div class="row">` + row.map(k => {
      const b = data.caps[k];
      return `<div class="cap g-${b.group}"><div class="key">${b.label}</div><div class="desc">${b.desc}</div></div>`;
    }).join("") + `</div>`
  ).join("");
}

const inTauri = !!(window.__TAURI__ || window.__TAURI_INTERNALS__);
function invoke(cmd, args = {}) {
  if (window.__TAURI__?.core?.invoke) return window.__TAURI__.core.invoke(cmd, args);
  if (window.__TAURI_INTERNALS__?.invoke) return window.__TAURI_INTERNALS__.invoke(cmd, args);
  return Promise.resolve(null);
}

function paint(enabled, hookOk, autostart) {
  document.getElementById("enabled").checked = enabled;
  if (typeof autostart === "boolean") {
    document.getElementById("autostart").checked = autostart;
  }
  const dot = document.getElementById("dot");
  const text = document.getElementById("statusText");
  dot.classList.toggle("off", !(enabled && hookOk));
  text.textContent = !hookOk ? "键盘钩子未挂载 — 稍后自动重试" : (enabled ? "生效中 · 键盘钩子已挂载" : "已停用");
}

async function refresh() {
  if (!inTauri) { paint(true, true); return; }
  try {
    const s = await invoke("get_status");
    if (s) paint(s.enabled, s.hook_ok, s.autostart);
  } catch (e) { paint(false, false); }
}

// 让无边框窗口贴合内容高度，避免透明区域挡住点击
function fitWindow() {
  if (!inTauri) return;
  const panel = document.querySelector(".panel");
  const h = Math.ceil(panel.getBoundingClientRect().height + 20);
  invoke("resize_panel", { height: h });
}

render();
if (!inTauri) document.getElementById("preview").hidden = false;
refresh();
requestAnimationFrame(fitWindow);
if (document.fonts?.ready) document.fonts.ready.then(fitWindow);

document.getElementById("enabled").addEventListener("change", async (e) => {
  const on = e.target.checked;
  if (inTauri) { try { await invoke("set_enabled", { on }); } catch (_) {} }
  paint(on, true);
});
document.getElementById("autostart").addEventListener("change", async (e) => {
  if (!inTauri) return;
  try {
    const real = await invoke("set_autostart", { on: e.target.checked });
    if (typeof real === "boolean") e.target.checked = real;
  } catch (_) {
    e.target.checked = !e.target.checked;
  }
});
document.getElementById("quit").addEventListener("click", () => {
  if (inTauri) invoke("quit_app"); else window.close();
});
if (inTauri) setInterval(refresh, 2000);
</script>
</body>
</html>
